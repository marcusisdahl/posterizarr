name: Integration tests

on:
  pull_request:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  agregarr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test webhook expansion and validation
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Test callback retry behavior
        shell: pwsh
        run: ./tests/AgregarrCallback.Tests.ps1
